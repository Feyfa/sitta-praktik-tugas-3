<template id="tpl-modal">
    <div class="modal-backdrop" v-if="show" @click.self="close">
        <div class="modal-dialog" role="dialog" aria-modal="true" :aria-label="title" ref="dialog">
            <div class="modal-header">
                <h2 v-text="title"></h2>
                <button class="modal-close" type="button" aria-label="Tutup" @click="close">&times;</button>
            </div>

            <slot></slot>
        </div>
    </div>
</template>
